name: rehearse_app
description: Android application for rehearsing and curating notes.
publish_to: 'none'
version: 0.7.0

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  accordion: ^2.6.0
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  firebase_core: ^4.2.1
  cloud_firestore: any
  firebase_auth: any
  font_awesome_flutter: ^10.6.0
  google_sign_in: ^7.2.0
  multi_dropdown: ^3.0.1
  flutter_timezone: ^5.0.1
  flutter_local_notifications: ^19.5.0
  rxdart: ^0.28.0
  timezone: ^0.10.1
  google_mlkit_text_recognition: ^0.15.0
  camera: ^0.11.2+1
  flex_color_picker: ^3.3.1
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - .env